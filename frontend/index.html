              'float': 'float 6s ease-in-out infinite',
              'shine': 'shine 2s linear infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },

                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },
              },

    <style>
      /* Custom scrollbar — purple/blue accent */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #041124; border-radius: 10px; }
      ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #6c36ed, #3477ff); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #7c46fd, #4487ff); }
      
      html { scroll-behavior: smooth; }
      
      /* Page base */
      html, body {
        background: #020914;
        color: #edf4ff;
        font-family: 'Inter', sans-serif;
      }
      
      /* Gradient text — matches app title gradient */
      .gradient-text {
        background: linear-gradient(90deg, #b65bff, #7855ff, #338dff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      /* Primary gradient — matches app buttons */
      .gradient-primary {
        background: linear-gradient(100deg, #6c36ed, #3477ff);
      }
      
      /* Soft radial glow background */
      .gradient-bg {
        background:
          radial-gradient(circle at 65% 15%, rgba(11,40,80,.18), transparent 32%),
          radial-gradient(circle at 20% 80%, rgba(110,53,237,.10), transparent 40%),
          #020914;
      }
      
      /* Loader */
      .loader {
        border: 3px solid rgba(108,54,237,.2);
        border-top: 3px solid #6c36ed;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .card-hover {
        transition: all 0.3s ease;
      }
      
      .card-hover:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 25px -5px rgba(108,54,237,.25), 0 10px 10px -5px rgba(52,119,255,.15);
      }
      
      /* Purple glow */
      .accent-glow {
        box-shadow: 0 0 30px rgba(108,54,237,.3);
      }
      
      .accent-glow:hover {
        box-shadow: 0 0 50px rgba(108,54,237,.5);
      }
      
      /* Subtle grid pattern using purple tint */
      .bg-grid-pattern {
        background-image: 
          linear-gradient(rgba(108,54,237,0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(108,54,237,0.06) 1px, transparent 1px);
        background-size: 30px 30px;
      }
    </style>
